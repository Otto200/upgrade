<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANKBUGS | Premium FX Workspace</title>
    <link rel="stylesheet" href="dashboard/style.css">
</head>
<body class="fintech-dashboard">
    <div class="dashboard-wrapper">
        
        <!-- Premium Sidebar Component -->
        <aside class="side-navigation">
            <div class="sidebar-brand">
                <div class="logo-mark">𝝮</div>
                <h2>BANKBUGS<span>FX</span></h2>
            </div>
            
            <nav class="nav-links-stack">
                <button class="menu-tab-btn active" data-view="models">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM21 9H3M21 15H3M12 3v18"/></svg>
                    <span>Trading Models</span>
                </button>
                <button class="menu-tab-btn" data-view="strategy">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    <span>Core Strategy</span>
                </button>
                <button class="menu-tab-btn" data-view="mentorship">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7zM1 5h14v14H1V5z"/></svg>
                    <span>Mentorship Library</span>
                </button>
                <button class="menu-tab-btn" data-view="setups">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
                    <span>Weekly Matrix</span>
                </button>
                <button class="menu-tab-btn" data-view="executions">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    <span>Live Executions</span>
                </button>
            </nav>
            
            
        </aside>

        <!-- Main Workspace Area -->
        <main class="main-workspace">

            <!-- Dynamic Interactive Analytics Panel -->
            <section id="dynamicViewport" class="content-viewport-panel">
                <!-- Content will swap instantly via JavaScript -->
            </section>
        </main>
        
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
