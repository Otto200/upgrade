<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANKBUGS | Premium FX Workspace</title>
    <link rel="stylesheet" href="dashboard/style.css">
</head>
<body class="fintech-dashboard">
    <div class="dashboard-wrapper">
        
        <!-- ==========================================
             STICKY DUAL-TIER TOP NAVIGATION SYSTEM
             ========================================== -->
        <div class="top-nav-container">
            
            <!-- TIER ONE: Brand & Gated Conversion -->
            <div class="tier-one">
                <div class="sidebar-brand">
                    <div class="logo-mark">𝝮</div>
                    <h2>BANKBUGS<span>FX</span></h2>
                </div>
                <button class="pro-unlock-btn" onclick="window.open('https://your-payment-link.com', '_blank')">
                    Go Pro
                </button>
            </div>

            <!-- TIER TWO: Core Tab Mechanics -->
            <nav class="tier-two-nav" aria-label="Terminal sections">
                <button class="menu-tab-btn active" data-view="models">Trading Models</button>
                <button class="menu-tab-btn" data-view="strategy">Core Strategy</button>
                <button class="menu-tab-btn" data-view="mentorship">Mentorship Library</button>
                <button class="menu-tab-btn" data-view="setups">Weekly Matrix</button>
                <button class="menu-tab-btn" data-view="executions">Live Executions</button>
            </nav>

        </div>

        <!-- ==========================================
             MAIN CONTENT WORKSPACE CANVAS
             ========================================== -->
        <main class="main-workspace">
            <section id="dynamicViewport" class="content-viewport-panel">
                <!-- Swapped instantly via JavaScript -->
            </section>
        </main>

        <!-- ==========================================
             LOCKED DUAL-TIER BOTTOM NAVIGATION BAR
             ========================================== -->
        <footer class="bottom-nav-lock">
            <!-- BOTTOM TIER ONE: Section Title -->
            <div class="bottom-tier-one">
                <span>CFD Platforms</span>
            </div>
            
            <!-- BOTTOM TIER TWO: Active Interactive Core Controls -->
            <nav class="bottom-tier-two" aria-label="Utility sections">
                <button class="bottom-nav-item menu-tab-btn" data-view="broker">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    <span>Broker</span>
                </button>
                <button class="bottom-nav-item menu-tab-btn" data-view="trade">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
                    <span>Trade</span>
                </button>
                <button class="bottom-nav-item menu-tab-btn" data-view="analysis">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
                    <span>Analysis</span>
                </button>
                <button class="bottom-nav-item menu-tab-btn" data-view="indicators">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    <span>Indicators/EA</span>
                </button>
                <button class="bottom-nav-item menu-tab-btn" data-view="more">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                    <span>More</span>
                </button>
            </nav>
        </footer>
        
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
