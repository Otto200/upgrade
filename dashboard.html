<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANKBUGS | FX Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="terminal-body">
    <div class="terminal-container">
        
        <!-- Premium Terminal Header -->
        <header class="term-header">
            <div class="term-brand">
                <span class="system-status-dot"></span>
                <h1>BANKBUGS / MATRIX WORKSPACE</h1>
            </div>
            <a href="login.html" class="term-logout" title="Exit Terminal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
                </svg>
            </a>
        </header>

        <!-- Institutional Data Tape Metrics -->
        <section class="ticker-tape">
            <div class="tape-item"><span class="t-lbl">PROP OBJECTIVE</span><span class="t-val green">+8.00%</span></div>
            <div class="tape-item"><span class="t-lbl">MAX DAILY RISK</span><span class="t-val red">1.50%</span></div>
            <div class="tape-item"><span class="t-lbl">LIQUIDITY MODEL</span><span class="t-val status">STABLE</span></div>
        </section>

        <!-- Premium Workspace Stack Layout -->
        <main class="workspace-wrapper">
            
            <!-- Sleek Horizontal Navigation Tab List -->
            <nav class="workspace-nav" aria-label="Terminal sections">
                <button class="nav-tab active" data-content="models">TRADING MODELS</button>
                <button class="nav-tab" data-content="strategy">CONCEPTS</button>
                <button class="nav-tab" data-content="mentorship">VIDEOS</button>
                <button class="nav-tab" data-content="setups">WEEKLY SETUPS</button>
                <button class="nav-tab" data-content="executions">LIVE DATA LOG</button>
            </nav>

            <!-- Dynamic Viewport Area -->
            <div id="workspaceContent" class="terminal-viewport">
                <!-- Content handled via dynamic JavaScript engine -->
            </div>
        </main>

        <!-- Minimal Platform Routing Links -->
        <footer class="terminal-footer">
            <span class="footer-title">CROSS-PLATFORM DEPLOYMENT:</span>
            <div class="footer-links">
                <a href="https://tradingview.com" target="_blank" class="f-link">TRADINGVIEW</a>
                <a href="https://metatrader5.com" target="_blank" class="f-link">METATRADER 5</a>
            </div>
        </footer>
        
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
