<!-- bb-admin-portal-99x.html - Your private off-dashboard console -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANKBUGS | Private Console</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0f19; color: #fff; padding: 40px; margin: 0; }
        .container { max-width: 700px; margin: 0 auto; background: #111827; border: 1px solid #1f2937; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #00e676; margin-top: 0; text-transform: uppercase; font-size: 20px; letter-spacing: 1px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #9ca3af; font-size: 14px; }
        textarea { width: 100%; height: 140px; background: #1f2937; color: #fff; border: 1px solid #374151; padding: 12px; margin-bottom: 20px; border-radius: 6px; box-sizing: border-box; font-family: monospace; resize: vertical; }
        textarea:focus { border-color: #00e676; outline: none; }
        button { background: #00e676; color: #000; padding: 14px 28px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; width: 100%; transition: background 0.2s; }
        button:hover { background: #00b359; }
        .status { margin-top: 15px; font-size: 14px; color: #9ca3af; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ BANKBUGS Private Signal Broadcaster</h2>
    <p style="color: #6b7280; font-size: 13px; margin-bottom: 25px;">This file is unlinked and hidden. Enter your subscriber token registry array and message below to fire alerts directly to your PWA app users.</p>

    <label for="userTokens">1. Active Client Subscriber Tokens (JSON Array Format)</label>
    <textarea id="userTokens" placeholder='[&#10;  {"endpoint":"https://...","keys":{"p256dh":"...","auth":"..."}}&#10;]'></textarea>

    <label for="signalMessage">2. Market Setup / Signal Content</label>
    <textarea id="signalMessage" placeholder="XAUUSD Liquidity Purge identified at 2032.50. Change of Character confirmed on 1M chart. Taking Buy Entries now. Risk managed tightly."></textarea>

    <button onclick="deploySignalAlert()">Deploy Broadcast Alert</button>
    <div id="statusReport" class="status"></div>
</div>

<script>
    async function deploySignalAlert() {
        const tokenInput = document.getElementById('userTokens').value.trim();
        const messageInput = document.getElementById('signalMessage').value.trim();
        const statusReport = document.getElementById('statusReport');

        if (!tokenInput || !messageInput) {
            alert("Execution halted: Both tokens and message payloads are mandatory.");
            return;
        }

        try {
            const parsedTokens = JSON.parse(tokenInput);
            statusReport.innerText = "Processing secure network broadcast payload...";

            const response = await fetch('/api/broadcast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tokens: parsedTokens, message: messageInput })
            });

            const result = await response.json();

            if (result.success) {
                statusReport.style.color = "#00e676";
                statusReport.innerText = "Success: Broadcast payload deployed to user devices.";
                document.getElementById('signalMessage').value = ""; // Clear signal text area
            } else {
                throw new Error(result.error || "Unknown server response issue.");
            }
        } catch (error) {
            statusReport.style.color = "#ef4444";
            statusReport.innerText = "Execution Error: " + error.message;
            console.error(error);
        }
    }
</script>

</body>
</html>
