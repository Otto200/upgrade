<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANKBUGS|FX - Strategy Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Hero Branding Header -->
        <header class="trader-profile">
            <div class="glow-avatar">
                <!-- SVG Icon: Terminal Style Bug/Chart Matrix -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="2" width="20" height="20" rx="4"></rect>
                    <path d="M6 16l4-4 4 4 4-8"></path>
                </svg>
            </div>
            <h1>BANKBUGS | FX</h1>
            <p class="tagline">Founded by Otto Eric • Since 2021</p>
            <div class="timeline-badge">Official TikTok Strategy App</div>
        </header>

        <!-- Dynamic Strategy App Selector -->
        <main class="strategy-card">
            <h2>📈 The Blueprint Matrix</h2>
            <p class="subtitle">Tap below to switch parameters between our Prop Firm Passing model and Live Broker execution algorithms.</p>
            
            <div class="tab-system">
                <button class="tab-btn active" data-strategy="prop">Prop Firm Passing</button>
                <button class="tab-btn" data-strategy="live">Live Execution</button>
            </div>

            <!-- Dynamic Display Box -->
            <div id="strategyDisplay" class="display-box">
                <!-- Content injected via JS -->
            </div>

            <!-- TikTok Directed Action Button -->
            <a href="https://tiktok.com" target="_blank" class="cta-btn">
                <span>Follow on TikTok</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path>
                </svg>
            </a>
        </main>

        <!-- Regional Trust Indicators -->
        <footer class="proof-footer">
            <div class="proof-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span>PNG Trusted</span>
            </div>
            <div class="proof-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 14 14"></polyline>
                </svg>
                <span>5-Year Track</span>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
