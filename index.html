<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Mobile Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Profile Header -->
        <header class="profile-header">
            <div class="avatar">🚀</div>
            <h1>Alex Developer</h1>
            <p>Building things with HTML, CSS, & JS</p>
        </header>

        <!-- Dynamic Content Card -->
        <main class="content-card">
            <div class="status-badge">
                <!-- SVG Vector Icon: Shield/Check -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span>Status: Available for hire</span>
            </div>
            
            <p class="description">Tap below to toggle a quick interactive greeting message.</p>
            <button id="actionBtn" class="primary-btn">Say Hello</button>
            <div id="messageBox" class="hidden"></div>
        </main>

        <!-- Navigation Links -->
        <footer class="icon-nav">
            <a href="https://github.com" class="nav-item" target="_blank" rel="noopener">
                <!-- SVG Vector Icon: GitHub -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                </svg>
                <span>GitHub</span>
            </a>
            <a href="https://vercel.com" class="nav-item" target="_blank" rel="noopener">
                <!-- SVG Vector Icon: Triangle (Vercel Style) -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12 2 22 22 2 22"></polygon>
                </svg>
                <span>Vercel</span>
            </a>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
